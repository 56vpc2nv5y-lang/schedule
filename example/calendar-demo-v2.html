const events={"2026-07-01": [{"type": "培训", "title": "越南公共安全培训大纲第二版", "time": "全天", "cls": "training", "note": ""}], "2026-07-02": [{"type": "项目", "title": "高能物理所参访资料整理", "time": "全天", "cls": "project", "note": ""}], "2026-07-07": [{"type": "项目", "title": "市场一部上半年业绩汇报 PPT", "time": "09:30", "cls": "project", "note": ""}, {"type": "项目", "title": "北理工协议材料准备", "time": "15:00", "cls": "project", "note": ""}], "2026-07-13": [{"type": "接待", "title": "联合国人居署北京半天接待", "time": "上午", "cls": "reception", "note": ""}, {"type": "项目", "title": "修改北理工技术材料", "time": "下午", "cls": "project", "note": ""}], "2026-07-15": [{"type": "项目", "title": "车辆维保英文版发新加坡", "time": "10:00", "cls": "project", "note": ""}, {"type": "项目", "title": "缪子技术讨论初稿", "time": "13:30", "cls": "project", "note": ""}], "2026-07-17": [{"type": "培训", "title": "乌兹 30 人入校报备", "time": "全天", "cls": "training", "note": ""}, {"type": "项目", "title": "下半年工作预测材料", "time": "下午", "cls": "project", "note": ""}], "2026-07-21": [{"type": "培训", "title": "越南大学培训第二版", "time": "全天", "cls": "training", "note": ""}, {"type": "培训", "title": "乌兹接待议程与主持稿", "time": "下午", "cls": "training", "note": ""}], "2026-07-22": [{"type": "培训", "title": "乌兹培训延期与退票处理", "time": "全天", "cls": "training", "note": ""}], "2026-07-24": [{"type": "项目", "title": "中用科技投标资料准备", "time": "全天", "cls": "project", "note": ""}], "2026-07-25": [{"type": "项目", "title": "下半年度工作预测发 Leader", "time": "11:00", "cls": "project", "note": ""}, {"type": "展会", "title": "越南兰州大会安排确认", "time": "15:30", "cls": "exhibition", "note": ""}], "2026-07-28": [{"type": "培训", "title": "越南培训翻译版提交", "time": "10:00", "cls": "training", "note": ""}, {"type": "项目", "title": "车辆 POC 客户需求整理", "time": "下午", "cls": "project", "note": ""}], "2026-07-29": [{"type": "项目", "title": "车辆 POC 需求发 Leader 审阅", "time": "11:00", "cls": "project", "note": ""}, {"type": "展会", "title": "越南邀请函发对接人", "time": "16:00", "cls": "exhibition", "note": ""}], "2026-07-30": [{"type": "展会", "title": "确认 LQDTU 两位参会人员名单", "time": "18:00", "cls": "exhibition", "note": ""}, {"type": "项目", "title": "中用科技盖章版本回传", "time": "20:00", "cls": "project", "note": ""}, {"type": "项目", "title": "车辆 POC 问题自查", "time": "今晚", "cls": "project", "note": ""}, {"type": "展会", "title": "更新可选择航班信息", "time": "全天", "cls": "exhibition", "note": ""}], "2026-07-31": [{"type": "项目", "title": "车辆 POC Leader 审核", "time": "上午", "cls": "project", "note": ""}, {"type": "展会", "title": "兰州大会航班最终确认", "time": "17:00", "cls": "exhibition", "note": ""}], "2026-08-01": [{"type": "展会", "title": "整理邀请嘉宾信息表", "time": "上午", "cls": "exhibition", "note": ""}]};
const weekdays=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const classMap={'项目':'project','培训':'training','接待':'reception','展会':'exhibition','个人/行政':'admin'};
const pillMap={'项目':'blue','培训':'purple','接待':'green','展会':'orange','个人/行政':'gray'};
let editing={date:TODAY,index:null};
function openDrawer(id){document.getElementById(id).classList.add('open');document.body.style.overflow='hidden'}
function closeDrawer(id){document.getElementById(id).classList.remove('open');document.body.style.overflow=''}
function formatDate(date){const d=new Date(date+'T00:00:00');return `${d.getMonth()+1}月${d.getDate()}日 · ${weekdays[d.getDay()]}`}
function toast(msg){let t=document.createElement('div');t.textContent=msg;t.style='position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#172033;color:white;padding:10px 16px;border-radius:10px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.18)';document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function showDay(date){
 const list=events[date]||[]; const canEdit=date>=TODAY;
 document.getElementById('dayTitle').textContent=formatDate(date);
 document.getElementById('dayCount').textContent=`${list.length} 项安排`;
 const box=document.getElementById('dayItems');
 box.innerHTML=list.length?list.map((e,i)=>`<div class="detail-card"><div class="row between"><span class="pill ${pillMap[e.type]}">${e.type}</span><span class="small muted">${e.time||'全天'}</span></div><div class="detail-title">${e.title}</div>${e.note?`<div class="small muted" style="margin-top:5px">${e.note}</div>`:''}${canEdit?`<div class="detail-actions"><button class="btn sm" onclick="openEditor('${date}',${i})">编辑</button></div>`:''}</div>`).join(''):`<div class="empty">当天暂无安排。${canEdit?'可以直接新建事项。':'历史日期仅供查看。'}</div>`;
 const actions=document.getElementById('dayActionArea');
 actions.innerHTML=canEdit?`<button class="btn primary" onclick="openEditor('${date}')">＋ 新建当天事项</button>`:`<div class="readonly-note">历史日期仅供查看，不能新建或编辑。</div>`;
 openDrawer('dayDrawer');
}
function openEvent(date,title,type,time){const idx=(events[date]||[]).findIndex(e=>e.title===title);if(date>=TODAY)openEditor(date,idx);else showDay(date)}
function openEditor(date,index=null){
 if(date<TODAY){toast('历史日期不能编辑');return}
 editing={date,index}; const e=index!==null?(events[date]||[])[index]:null;
 document.getElementById('editHeading').textContent=e?'编辑事项':'新建事项';
 document.getElementById('eventDate').value=date;
 document.getElementById('eventTitle').value=e?.title||'';
 document.getElementById('eventTime').value=(e?.time&&/^\d{2}:\d{2}$/.test(e.time))?e.time:'09:30';
 document.getElementById('eventType').value=e?.type||'项目';
 document.getElementById('eventNote').value=e?.note||'';
 closeDrawer('dayDrawer'); openDrawer('editDrawer');
}
function saveEvent(){
 const date=document.getElementById('eventDate').value; const title=document.getElementById('eventTitle').value.trim();
 if(!title){toast('请填写事项标题');return} if(date<TODAY){toast('只能选择今天或未来日期');return}
 const type=document.getElementById('eventType').value; const time=document.getElementById('eventTime').value||'全天'; const note=document.getElementById('eventNote').value.trim();
 const obj={type,title,time,cls:classMap[type],note}; events[date]=events[date]||[];
 if(editing.index!==null&&editing.date===date) events[date][editing.index]=obj; else events[date].push(obj);
 renderCell(editing.date); if(date!==editing.date) renderCell(date); closeDrawer('editDrawer'); toast('事项已保存'); showDay(date);
}
function renderCell(date){
 const cell=document.querySelector(`.day[data-date="${date}"]`); if(!cell)return;
 cell.querySelectorAll('.event,.more').forEach(x=>x.remove());
 const list=events[date]||[];
 list.slice(0,2).forEach(e=>{const b=document.createElement('button');b.className=`event type-${classMap[e.type]}`;b.innerHTML=`<span class="event-time">${e.time}</span>${e.title}`;b.onclick=(ev)=>{ev.stopPropagation();openEvent(date,e.title,e.type,e.time)};cell.appendChild(b)});
 if(list.length>2){const m=document.createElement('button');m.className='more';m.textContent=`还有 ${list.length-2} 项`;m.onclick=(ev)=>{ev.stopPropagation();showDay(date)};cell.appendChild(m)}
}
